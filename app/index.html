<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint to avoid a dark flash.
      try {
        if (JSON.parse(localStorage.getItem("admitica.theme")) === "light")
          document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Abitura</title>
    <meta
      name="description"
      content="Abitura: поступление в Китай. Каталог вузов с проверенными фактами с официальных страниц, фильтр по формальным условиям и план подачи в браузере."
    />
    <!-- Favicons: PNG first, SVG last (Chrome picks the last supported; Safari skips SVG) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      The document-export CDN scripts (docx / pdfmake from unpkg) used by the
      legacy src/downloads.js are intentionally NOT loaded in this build: the
      «Китай» storefront makes no external calls (spec), and the screens that
      export documents (Essay / Resume) are behind FEATURES.ai. Restore the
      three <script defer src="https://unpkg.com/…"> tags together with the flag.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
